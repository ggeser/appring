[package]
name = "ring-cxxqt"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ring-cxxqt"
path = "src/main.rs"

[dependencies]
# mirql's love-sparkle: every mirql manifest has it (exact pin).
mirql-love-sparkle = "=0.7.1"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
opt-level = 2
debug = false
