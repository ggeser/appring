[package]
name = "ring-egui"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ring-egui"
path = "src/main.rs"

[dependencies]
# mirql's love-sparkle: every mirql manifest has it (exact pin).
mirql-love-sparkle = "=0.7.1"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.36"
serde_json = "1"

[profile.release]
opt-level = 2
debug = false
